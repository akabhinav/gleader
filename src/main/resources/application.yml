spring:
  application:
    name: gaming-leaderboard

  datasource:
    url: jdbc:h2:mem:leaderboard;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=60s

server:
  port: 8080

leaderboard:
  cache:
    enabled: true
  pagination:
    default-size: 50
    max-size: 1000
