version: '3.8'

# Simplified Docker Compose for local development
# Uses H2 database (no PostgreSQL needed)
# Run with: docker-compose -f docker-compose.local.yml up

services:
  redis:
    image: redis:7-alpine
    container_name: leaderboard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
